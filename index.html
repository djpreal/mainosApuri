<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LIVE CAM FX — PC &amp; MOBILE</title>
  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(8, 12, 22, 0.94);
      --panel-border: rgba(0, 255, 159, 0.38);
      --text: #f3f7ff;
      --accent: #00ff9f;
      --accent-2: #00d8ff;
      --accent-3: #b8ff2c;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
      background: #05070d;
      touch-action: none;
    }

    #cam-hud-pill {
      position: fixed;
      top: calc(10px + var(--safe-top));
      left: calc(10px + var(--safe-left));
      z-index: 20;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(8, 13, 24, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--accent);
      pointer-events: none;
    }

    .hud-hidden #bottom-dock,
    .hud-hidden #control-drawer,
    .hud-hidden #cam-hud-pill {
      display: none !important;
    }

    button, .btn-file {
      appearance: none;
      -webkit-appearance: none;
      border: 2px solid var(--panel-border);
      background: rgba(8, 15, 28, 0.92);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 9px;
      min-height: 38px;
      font-size: 11px;
      font-weight: 700;
      font-family: "Courier New", Courier, monospace;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      transition: transform 0.06s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:active, .btn-file:active {
      transform: scale(0.95);
      border-color: var(--accent);
    }

    button.active {
      border-color: var(--accent-3);
      box-shadow: 0 0 0 2px rgba(184, 255, 44, 0.25);
      color: var(--accent-3);
      background: rgba(18, 38, 48, 0.98);
    }

    #control-drawer {
      position: fixed;
      left: calc(8px + var(--safe-left));
      right: calc(8px + var(--safe-right));
      bottom: calc(102px + var(--safe-bottom));
      max-width: 480px;
      margin-left: auto;
      max-height: calc(100dvh - 140px - var(--safe-top) - var(--safe-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      z-index: 25;
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 11px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.92);
    }

    #control-drawer.open {
      display: flex;
    }

    .section-title {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    input[type="range"] {
      flex: 1;
      min-width: 80px;
      height: 28px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    #bottom-dock {
      position: fixed;
      left: calc(8px + var(--safe-left));
      right: calc(8px + var(--safe-right));
      bottom: calc(8px + var(--safe-bottom));
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }

    .dock-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 5px;
      width: 100%;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      pointer-events: auto;
      touch-action: pan-x;
    }

    .dock-row::-webkit-scrollbar {
      display: none;
    }

    #bottom-dock button {
      flex: 0 0 auto;
      white-space: nowrap;
      padding: 7px 9px;
      min-height: 38px;
      font-size: 10.5px;
      background: rgba(8, 15, 28, 0.92);
    }

    #hidden-type-sink {
      position: fixed;
      left: 50%;
      bottom: calc(108px + var(--safe-bottom));
      transform: translateX(-50%);
      width: 240px;
      height: 36px;
      opacity: 0.01;
      z-index: 40;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="cam-video" playsinline autoplay muted style="display:none;"></video>
  <input
    id="hidden-type-sink"
    type="text"
    inputmode="text"
    enterkeyhint="done"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="characters"
    spellcheck="false"
  />

  <div id="cam-hud-pill">CAM: OFF · RAW</div>

  <aside id="control-drawer">
    <div>
      <div class="section-title">
        <span>Kamera (Puhelin &amp; PC)</span>
        <span id="drawer-cam-info">EI AKTIIVINEN</span>
      </div>
      <div class="row">
        <button id="btn-cam-toggle">KAMERA ON/OFF</button>
        <button id="btn-cam-front" class="active">ETU</button>
        <button id="btn-cam-back">TAKA</button>
        <button id="btn-cam-cycle">VAIHDA (PC/PUH)</button>
      </div>
    </div>

    <div>
      <div class="section-title">
        <span>Live Kameraefektit</span>
        <span id="drawer-cam-fx">RAW</span>
      </div>
      <div class="row" id="drawer-cam-fx-list"></div>
    </div>

    <div>
      <div class="section-title">
        <span>Taustaefektit (Päälle / Pois)</span>
        <span id="drawer-bg-status">POIS</span>
      </div>
      <div class="row" style="margin-bottom:6px;">
        <button id="btn-bg-toggle">TAUSTA-FX ON/OFF</button>
        <button id="btn-tap">TAP BPM: <span id="bpm-val">120</span></button>
        <input id="bpm-slider" type="range" min="50" max="220" value="120" />
      </div>
      <div class="row" id="drawer-bg-fx-list"></div>
    </div>

    <div>
      <div class="section-title">
        <span>Kuva / Logo &amp; Teksti</span>
        <span id="drawer-logo-status">Ei kuvaa</span>
      </div>
      <div class="row">
        <label class="btn-file">
          LATAA KUVA/LOGO <input id="file-logo" type="file" accept="image/*" />
        </label>
        <button id="btn-logo-toggle">KUVA ON/OFF</button>
        <button id="btn-logo-dn">L-</button>
        <button id="btn-logo-up">L+</button>
        <button id="btn-txt-toggle">TXT ON/OFF</button>
        <button id="btn-txt-write">KIRJOITA</button>
        <button id="btn-font-cycle">FONT: <span id="font-val">MONO</span></button>
      </div>
    </div>
  </aside>

  <div id="bottom-dock">
    <div class="dock-row">
      <button id="dock-cam">CAM ON/OFF</button>
      <button id="dock-front" class="active">ETU</button>
      <button id="dock-back">TAKA</button>
      <button id="dock-flip">VAIHDA</button>
      <button id="dock-camfx">FX: RAW</button>
    </div>
    <div class="dock-row">
      <button id="dock-bgfx">TAUSTA-FX: OFF</button>
      <button id="dock-txt-toggle">TXT ON/OFF</button>
      <button id="dock-write">KIRJOITA</button>
      <button id="dock-logo">KUVA/LOGO</button>
      <button id="dock-panel">ASETUKSET</button>
    </div>
  </div>

  <script>
    (() => {
      const isTouchDevice = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
      const videoEl = document.getElementById("cam-video");
      const hiddenSink = document.getElementById("hidden-type-sink");

      const camInCanvas = document.createElement("canvas");
      const camInCtx = camInCanvas.getContext("2d", { willReadFrequently: true });

      const camFxCanvas = document.createElement("canvas");
      const camFxCtx = camFxCanvas.getContext("2d");

      const smokeTrailCanvas = document.createElement("canvas");
      const smokeTrailCtx = smokeTrailCanvas.getContext("2d");

      const CAM_FX = [
        { id: "raw", label: "RAW" },
        { id: "ghost", label: "GHOST" },
        { id: "smoke", label: "SAVU" },
        { id: "fire", label: "TULI" },
        { id: "matrix", label: "MATRIX" },
        { id: "neon", label: "NEON" },
        { id: "vhs", label: "VHS" }
      ];

      const BG_SCENES = [
        { id: 0, label: "POIS" },
        { id: 1, label: "AALLOT" },
        { id: 2, label: "PYÖRRE" },
        { id: 3, label: "KEHÄT" },
        { id: 4, label: "RUUDUKKO" },
        { id: 5, label: "SÄTEET" }
      ];

      const FONTS = [
        { label: "MONO", family: '"Courier New", Courier, monospace' },
        { label: "IMPACT", family: '"Impact", "Arial Black", sans-serif' },
        { label: "FUTURA", family: '"Futura", "Trebuchet MS", sans-serif' },
        { label: "SERIF", family: '"Georgia", serif' }
      ];

      const PALETTE = ["#00ff9f", "#00d8ff", "#ff3b8d", "#ffd319", "#ffffff"];

      const state = {
        width: 1,
        height: 1,
        dpr: Math.min(window.devicePixelRatio || 1, isTouchDevice ? 1.5 : 2),
        time: 0,
        lastFrame: performance.now(),
        bpm: 120,
        beatPhase: 0,
        bassPulse: 0,
        tapTimes: [],
        hudHidden: false,

        bgEnabled: false,
        bgScene: 1,

        cam: {
          enabled: false,
          fxIndex: 1, // aloitetaan GHOST-efektillä kun kamera avataan
          facingMode: "user",
          devices: [],
          deviceIndex: 0,
          isMirrored: !isTouchDevice,
          stream: null,
          lastProcessTime: 0
        },

        logoVisible: true,
        logoScale: 1.0,
        logoImg: null,

        textVisible: false,
        liveText: "LIVE CAM",
        typingActive: false,
        typeDraft: "LIVE CAM",
        fontIndex: 0,
        textScale: 1.35
      };

      function resize() {
        const maxDpr = isTouchDevice ? 1.5 : 2;
        state.dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        const gw = isTouchDevice ? 144 : 192;
        const gh = Math.max(84, Math.round(gw * (state.height / Math.max(1, state.width))));
        camInCanvas.width = gw;
        camInCanvas.height = gh;
        camFxCanvas.width = gw;
        camFxCanvas.height = gh;
        smokeTrailCanvas.width = gw;
        smokeTrailCanvas.height = gh;
      }

      window.addEventListener("resize", resize);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
      resize();

      // KAMERAHALLINTA: PC + PUHELIN ETU/TAKA
      async function refreshVideoDevices() {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
          const list = await navigator.mediaDevices.enumerateDevices();
          const cams = list.filter(d => d.kind === "videoinput");
          state.cam.devices = cams;
          return cams;
        } catch (_) {
          return [];
        }
      }

      function inferMirrorFromLabel(label, fallbackFacing) {
        const l = (label || "").toLowerCase();
        if (/back|rear|environment|taka|world/i.test(l)) return false;
        if (/front|user|face|etu|integrated|webcam|pc|usb/i.test(l)) return true;
        return fallbackFacing === "user";
      }

      async function startCamera(mode = "auto") {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          if (state.cam.stream) {
            state.cam.stream.getTracks().forEach(t => t.stop());
            state.cam.stream = null;
          }

          const devices = await refreshVideoDevices();
          let stream = null;

          if (mode === "front") {
            state.cam.facingMode = "user";
            const frontDev = devices.find(d => /front|user|face|etu/i.test(d.label || ""));
            if (frontDev) {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: frontDev.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
              }).catch(() => null);
              if (stream) state.cam.isMirrored = true;
            }
            if (!stream) {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
              }).catch(() => null);
              if (stream) state.cam.isMirrored = true;
            }
          } else if (mode === "back") {
            state.cam.facingMode = "environment";
            const backDev = devices.find(d => /back|rear|environment|taka|world/i.test(d.label || ""));
            if (backDev) {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: { exact: backDev.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
              }).catch(() => null);
              if (stream) state.cam.isMirrored = false;
            }
            if (!stream) {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
              }).catch(() => null);
              if (stream) state.cam.isMirrored = false;
            }
          } else if (mode === "cycle" && devices.length > 1) {
            state.cam.deviceIndex = (state.cam.deviceIndex + 1) % devices.length;
            const dev = devices[state.cam.deviceIndex];
            stream = await navigator.mediaDevices.getUserMedia({
              video: { deviceId: { exact: dev.deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false
            }).catch(() => null);
            if (stream) {
              state.cam.isMirrored = inferMirrorFromLabel(dev.label, state.cam.facingMode);
              state.cam.facingMode = state.cam.isMirrored ? "user" : "environment";
            }
          }

          if (!stream) {
            stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: state.cam.facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
              audio: false
            }).catch(() => null);
            if (stream) state.cam.isMirrored = state.cam.facingMode === "user";
          }

          if (!stream) {
            stream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            }).catch(() => null);
            if (stream) state.cam.isMirrored = !isTouchDevice;
          }

          if (!stream) {
            state.cam.enabled = false;
            updateUi();
            return;
          }

          await refreshVideoDevices();
          state.cam.stream = stream;
          videoEl.srcObject = stream;
          await videoEl.play().catch(() => {});
          state.cam.enabled = true;
          updateUi();
        } catch (err) {
          console.warn("Camera error:", err);
          state.cam.enabled = false;
          updateUi();
        }
      }

      function stopCamera() {
        if (state.cam.stream) {
          state.cam.stream.getTracks().forEach(t => t.stop());
          state.cam.stream = null;
        }
        videoEl.srcObject = null;
        state.cam.enabled = false;
        smokeTrailCtx.clearRect(0, 0, smokeTrailCanvas.width, smokeTrailCanvas.height);
        updateUi();
      }

      function toggleCamera() {
        if (state.cam.enabled) stopCamera();
        else startCamera("auto");
      }

      function switchToFrontCamera() {
        state.cam.facingMode = "user";
        state.cam.isMirrored = true;
        startCamera("front");
      }

      function switchToBackCamera() {
        state.cam.facingMode = "environment";
        state.cam.isMirrored = false;
        startCamera("back");
      }

      function flipCameraDevice() {
        if (state.cam.devices.length > 1) {
          startCamera("cycle");
        } else if (state.cam.facingMode === "user") {
          switchToBackCamera();
        } else {
          switchToFrontCamera();
        }
      }

      function cycleCamFx() {
        state.cam.fxIndex = (state.cam.fxIndex + 1) % CAM_FX.length;
        updateUi();
      }

      function renderLiveCameraEffects(t, now) {
        if (!state.cam.enabled || videoEl.readyState < 2) return;
        const w = state.width;
        const h = state.height;
        const gw = camInCanvas.width;
        const gh = camInCanvas.height;
        const fx = CAM_FX[state.cam.fxIndex].id;

        if (now - state.cam.lastProcessTime > 32) {
          state.cam.lastProcessTime = now;
          camInCtx.save();
          if (state.cam.isMirrored) {
            camInCtx.translate(gw, 0);
            camInCtx.scale(-1, 1);
          }
          camInCtx.drawImage(videoEl, 0, 0, gw, gh);
          camInCtx.restore();

          if (fx === "raw" || fx === "vhs") {
            camFxCtx.clearRect(0, 0, gw, gh);
            camFxCtx.drawImage(camInCanvas, 0, 0, gw, gh);
          } else {
            const src = camInCtx.getImageData(0, 0, gw, gh);
            const d = src.data;
            const outImg = camFxCtx.createImageData(gw, gh);
            const od = outImg.data;

            if (fx === "smoke") {
              smokeTrailCtx.save();
              smokeTrailCtx.globalCompositeOperation = "source-over";
              smokeTrailCtx.fillStyle = "rgba(5, 7, 13, 0.14)";
              smokeTrailCtx.fillRect(0, 0, gw, gh);
              smokeTrailCtx.restore();

              for (let y = 0; y < gh; y++) {
                for (let x = 0; x < gw; x++) {
                  const idx = (y * gw + x) * 4;
                  const lum = d[idx] * 0.3 + d[idx + 1] * 0.59 + d[idx + 2] * 0.11;
                  const puff = Math.max(0, (lum - 48) / 207);
                  const swirl = 0.65 + 0.35 * Math.sin(x * 0.14 + t * 3.0) * Math.cos(y * 0.12 - t * 2.3);
                  const a = Math.min(215, Math.round(puff * swirl * 195));
                  od[idx] = Math.min(255, Math.round(180 + puff * 75));
                  od[idx + 1] = Math.min(255, Math.round(210 + puff * 45));
                  od[idx + 2] = Math.min(255, Math.round(235 + puff * 20));
                  od[idx + 3] = a;
                }
              }
              camFxCtx.putImageData(outImg, 0, 0);

              smokeTrailCtx.save();
              smokeTrailCtx.globalAlpha = 0.75;
              smokeTrailCtx.drawImage(camFxCanvas, Math.sin(t * 1.5) * 2.5, -2.0, gw, gh);
              smokeTrailCtx.restore();
            } else if (fx === "fire") {
              for (let y = 0; y < gh; y++) {
                for (let x = 0; x < gw; x++) {
                  const idx = (y * gw + x) * 4;
                  const lum = d[idx] * 0.3 + d[idx + 1] * 0.59 + d[idx + 2] * 0.11;
                  const flicker = 0.78 + 0.22 * Math.sin(x * 0.22 + t * 15 + y * 0.14);
                  const heat = Math.min(1, (lum / 215) * flicker + (1 - y / gh) * 0.24);
                  od[idx] = Math.min(255, Math.round(heat * 255));
                  od[idx + 1] = Math.min(255, Math.round(Math.pow(heat, 1.65) * 195));
                  od[idx + 2] = Math.min(255, Math.round(Math.pow(heat, 3.1) * 85));
                  od[idx + 3] = lum > 30 ? Math.min(235, Math.round(heat * 235)) : 0;
                }
              }
              camFxCtx.putImageData(outImg, 0, 0);
            } else if (fx === "matrix") {
              for (let y = 0; y < gh; y++) {
                for (let x = 0; x < gw; x++) {
                  const idx = (y * gw + x) * 4;
                  const lum = d[idx] * 0.3 + d[idx + 1] * 0.59 + d[idx + 2] * 0.11;
                  const scan = (y + Math.floor(t * 28)) % 4 === 0 ? 1.3 : 0.72;
                  const gVal = Math.min(255, Math.round((lum / 255) * 255 * scan));
                  od[idx] = Math.round(gVal * 0.12);
                  od[idx + 1] = gVal;
                  od[idx + 2] = Math.round(gVal * 0.25);
                  od[idx + 3] = lum > 25 ? 220 : 40;
                }
              }
              camFxCtx.putImageData(outImg, 0, 0);
            } else if (fx === "neon") {
              for (let y = 1; y < gh - 1; y++) {
                for (let x = 1; x < gw - 1; x++) {
                  const idx = (y * gw + x) * 4;
                  const idxL = (y * gw + (x - 1)) * 4;
                  const idxR = (y * gw + (x + 1)) * 4;
                  const idxU = ((y - 1) * gw + x) * 4;
                  const idxD = ((y + 1) * gw + x) * 4;
                  const lumL = d[idxL] * 0.3 + d[idxL + 1] * 0.59 + d[idxL + 2] * 0.11;
                  const lumR = d[idxR] * 0.3 + d[idxR + 1] * 0.59 + d[idxR + 2] * 0.11;
                  const lumU = d[idxU] * 0.3 + d[idxU + 1] * 0.59 + d[idxU + 2] * 0.11;
                  const lumD = d[idxD] * 0.3 + d[idxD + 1] * 0.59 + d[idxD + 2] * 0.11;
                  const mag = Math.abs(lumR - lumL) + Math.abs(lumD - lumU);
                  if (mag > 34) {
                    od[idx] = 0;
                    od[idx + 1] = 240;
                    od[idx + 2] = 255;
                    od[idx + 3] = Math.min(245, Math.round(mag * 2.3));
                  } else {
                    od[idx + 3] = 0;
                  }
                }
              }
              camFxCtx.putImageData(outImg, 0, 0);
            } else {
              // GHOST
              const edgeThreshold = 42;
              for (let y = 1; y < gh - 1; y++) {
                for (let x = 1; x < gw - 1; x++) {
                  const idx = (y * gw + x) * 4;
                  const idxL = (y * gw + (x - 1)) * 4;
                  const idxR = (y * gw + (x + 1)) * 4;
                  const idxU = ((y - 1) * gw + x) * 4;
                  const idxD = ((y + 1) * gw + x) * 4;
                  const lumL = d[idxL] * 0.3 + d[idxL + 1] * 0.59 + d[idxL + 2] * 0.11;
                  const lumR = d[idxR] * 0.3 + d[idxR + 1] * 0.59 + d[idxR + 2] * 0.11;
                  const lumU = d[idxU] * 0.3 + d[idxU + 1] * 0.59 + d[idxU + 2] * 0.11;
                  const lumD = d[idxD] * 0.3 + d[idxD + 1] * 0.59 + d[idxD + 2] * 0.11;
                  const mag = Math.abs(lumR - lumL) + Math.abs(lumD - lumU);
                  if (mag > edgeThreshold) {
                    const strength = Math.min(1, (mag - edgeThreshold) / 68);
                    od[idx] = 160;
                    od[idx + 1] = 255;
                    od[idx + 2] = 225;
                    od[idx + 3] = Math.min(235, Math.round(120 + strength * 115));
                  } else {
                    od[idx + 3] = 0;
                  }
                }
              }
              camFxCtx.putImageData(outImg, 0, 0);
            }
          }
        }

        ctx.save();
        if (fx === "raw") {
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.drawImage(camFxCanvas, 0, 0, w, h);
        } else if (fx === "smoke") {
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.78;
          ctx.drawImage(smokeTrailCanvas, 0, 0, w, h);
          ctx.globalAlpha = 0.88;
          ctx.drawImage(camFxCanvas, 0, 0, w, h);
        } else if (fx === "fire") {
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.92;
          ctx.drawImage(camFxCanvas, 0, -Math.abs(Math.sin(t * 8)) * 10, w, h);
        } else if (fx === "matrix") {
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.9;
          ctx.drawImage(camFxCanvas, 0, 0, w, h);
          ctx.font = 'bold 12px "Courier New", monospace';
          ctx.fillStyle = "#00ff66";
          const chars = "01アイウエオカキクケコ#$";
          for (let c = 0; c < 18; c++) {
            const mx = ((c + 0.5) / 18) * w;
            const my = ((t * 145 + c * 63) % Math.max(120, h - 120)) + 40;
            ctx.fillText(chars[Math.floor(t * 15 + c * 5) % chars.length], mx, my);
          }
        } else if (fx === "neon") {
          ctx.globalCompositeOperation = "screen";
          ctx.globalAlpha = 0.92;
          ctx.drawImage(camFxCanvas, -4, 0, w, h);
          ctx.drawImage(camFxCanvas, 4, 0, w, h);
        } else if (fx === "vhs") {
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          const slices = 12;
          const sh = h / slices;
          for (let i = 0; i < slices; i++) {
            const jitter = ((i + Math.floor(t * 12)) % 5 === 0) ? Math.sin(t * 35 + i) * 14 : 0;
            ctx.drawImage(camFxCanvas, 0, (i / slices) * gh, gw, gh / slices, jitter, i * sh, w, sh + 1);
          }
          ctx.fillStyle = "rgba(0,0,0,0.22)";
          for (let y = 0; y < h; y += 5) ctx.fillRect(0, y, w, 2);
        } else {
          ctx.globalCompositeOperation = "screen";
          const dx = Math.sin(t * 1.6) * 7;
          const dy = Math.cos(t * 1.2) * 5;
          ctx.globalAlpha = 0.42;
          ctx.drawImage(camFxCanvas, dx - 5, dy - 4, w, h);
          ctx.globalAlpha = 0.92;
          ctx.drawImage(camFxCanvas, dx, dy, w, h);
        }
        ctx.restore();
      }

      function renderBackgroundScene() {
        const w = state.width;
        const h = state.height;
        const cx = w * 0.5;
        const cy = h * 0.5;
        const minDim = Math.min(w, h);
        const t = state.time;

        ctx.fillStyle = state.cam.enabled && !state.bgEnabled ? "#000000" : "#05070d";
        ctx.fillRect(0, 0, w, h);

        if (!state.bgEnabled || state.bgScene === 0) return;

        ctx.save();
        ctx.globalCompositeOperation = "screen";

        if (state.bgScene === 1) {
          for (let i = 0; i < 7; i++) {
            ctx.strokeStyle = PALETTE[i % PALETTE.length];
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let x = 0; x <= w; x += 24) {
              const y = cy - 90 + i * 30 + Math.sin(x * 0.018 + t * 3 + i * 0.5) * (18 + state.bassPulse * 24);
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }
        } else if (state.bgScene === 2) {
          for (let i = 1; i <= 36; i++) {
            const ang = i * 0.42 - t * 2.2;
            const rad = (i / 36) * minDim * (0.45 + state.bassPulse * 0.14);
            ctx.fillStyle = PALETTE[i % PALETTE.length];
            ctx.fillRect(cx + Math.cos(ang) * rad - 5, cy + Math.sin(ang) * rad - 5, 10, 10);
          }
        } else if (state.bgScene === 3) {
          for (let i = 1; i <= 6; i++) {
            const rad = minDim * (0.08 * i + state.bassPulse * 0.04);
            ctx.strokeStyle = PALETTE[i % PALETTE.length];
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, t * (0.7 + i * 0.15), t * (0.7 + i * 0.15) + Math.PI * 1.4);
            ctx.stroke();
          }
        } else if (state.bgScene === 4) {
          const step = 36;
          for (let y = 40; y < h - 90; y += step) {
            for (let x = 16; x < w - 16; x += step) {
              if (Math.sin(x * 0.02 + y * 0.02 - t * 3 + state.bassPulse * 3) > 0.25) {
                ctx.fillStyle = PALETTE[Math.abs(Math.floor((x + y) / step)) % PALETTE.length];
                ctx.fillRect(x, y, 10, 10);
              }
            }
          }
        } else if (state.bgScene === 5) {
          for (let i = 0; i < 16; i++) {
            const ang = (i / 16) * Math.PI * 2 + t * 1.5;
            ctx.strokeStyle = PALETTE[i % PALETTE.length];
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(ang) * minDim * 0.85, cy + Math.sin(ang) * minDim * 0.85);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function renderLogo() {
        if (!state.logoVisible || !state.logoImg) return;
        const img = state.logoImg;
        const w = state.width;
        const h = state.height;
        const size = Math.min(w, h) * 0.28 * state.logoScale * (1 + state.bassPulse * 0.18);
        const aspect = img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
        let dw = size;
        let dh = size;
        if (aspect >= 1) dh = size / aspect;
        else dw = size * aspect;

        ctx.save();
        ctx.translate(w * 0.5, h * 0.5);
        ctx.drawImage(img, -dw * 0.5, -dh * 0.5, dw, dh);
        ctx.restore();
      }

      function renderText() {
        const draft = state.typingActive && document.activeElement === hiddenSink ? hiddenSink.value : state.typeDraft;
        const txt = state.typingActive
          ? `${draft}${Math.floor(state.time * 4) % 2 === 0 ? "_" : ""}`
          : state.liveText;
        if ((!state.textVisible && !state.typingActive) || !txt) return;

        const w = state.width;
        const h = state.height;
        const fontSize = Math.max(30, Math.min(w, h) * 0.13) * state.textScale * (1 + state.bassPulse * 0.12);
        ctx.save();
        ctx.font = `900 ${fontSize}px ${FONTS[state.fontIndex].family}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#05070d";
        ctx.lineWidth = 4;
        ctx.strokeText(txt, w * 0.5, h * 0.5);
        ctx.fillText(txt, w * 0.5, h * 0.5);
        ctx.restore();
      }

      function registerTap() {
        const now = performance.now();
        state.tapTimes = state.tapTimes.filter(t => now - t < 4000);
        state.tapTimes.push(now);
        if (state.tapTimes.length >= 2) {
          let sum = 0;
          for (let i = 1; i < state.tapTimes.length; i++) sum += state.tapTimes[i] - state.tapTimes[i - 1];
          const bpm = Math.round(60000 / (sum / (state.tapTimes.length - 1)));
          if (bpm >= 50 && bpm <= 220) {
            state.bpm = bpm;
            document.getElementById("bpm-slider").value = bpm;
          }
        }
        state.beatPhase = 0;
        state.bassPulse = 1.0;
        updateUi();
      }

      function startDirectTyping() {
        state.typingActive = true;
        state.typeDraft = "";
        state.textVisible = true;
        hiddenSink.value = "";
        hiddenSink.focus({ preventScroll: true });
        updateUi();
      }

      function commitDirectTyping() {
        if (!state.typingActive) return;
        state.liveText = state.typeDraft;
        state.typingActive = false;
        state.textVisible = state.liveText.trim().length > 0;
        hiddenSink.value = "";
        hiddenSink.blur();
        updateUi();
      }

      function cancelDirectTyping() {
        if (!state.typingActive) return;
        state.typingActive = false;
        state.typeDraft = state.liveText;
        hiddenSink.value = "";
        hiddenSink.blur();
        updateUi();
      }

      hiddenSink.addEventListener("input", () => {
        if (state.typingActive) state.typeDraft = hiddenSink.value;
      });
      hiddenSink.addEventListener("keydown", e => {
        if (!state.typingActive) return;
        if (e.key === "Enter") { e.preventDefault(); state.typeDraft = hiddenSink.value || state.typeDraft; commitDirectTyping(); }
        else if (e.key === "Escape") { e.preventDefault(); cancelDirectTyping(); }
      });

      document.getElementById("file-logo").addEventListener("change", e => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            state.logoImg = img;
            state.logoVisible = true;
            document.getElementById("drawer-logo-status").textContent = file.name.slice(0, 18);
            updateUi();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      // Rakennan asetuspaneelin listat
      const camFxListEl = document.getElementById("drawer-cam-fx-list");
      CAM_FX.forEach((cf, idx) => {
        const b = document.createElement("button");
        b.textContent = cf.label;
        b.dataset.cfx = idx;
        b.addEventListener("click", () => {
          state.cam.fxIndex = idx;
          updateUi();
        });
        camFxListEl.appendChild(b);
      });

      const bgFxListEl = document.getElementById("drawer-bg-fx-list");
      BG_SCENES.forEach(sc => {
        const b = document.createElement("button");
        b.textContent = sc.label;
        b.dataset.bg = sc.id;
        b.addEventListener("click", () => {
          state.bgScene = sc.id;
          state.bgEnabled = sc.id !== 0;
          updateUi();
        });
        bgFxListEl.appendChild(b);
      });

      function updateUi() {
        const fxLabel = CAM_FX[state.cam.fxIndex].label;
        const sideLabel = state.cam.facingMode === "user" ? "ETU" : "TAKA";
        const bgLabel = state.bgEnabled && state.bgScene !== 0
          ? (BG_SCENES.find(s => s.id === state.bgScene)?.label || "ON")
          : "OFF";

        document.getElementById("cam-hud-pill").textContent =
          `CAM: ${state.cam.enabled ? `ON (${sideLabel})` : "OFF"} · FX: ${fxLabel}`;
        document.getElementById("drawer-cam-info").textContent =
          state.cam.enabled ? `${sideLabel} · ${state.cam.devices.length || 1} KAM` : "EI AKTIIVINEN";
        document.getElementById("drawer-cam-fx").textContent = fxLabel;
        document.getElementById("drawer-bg-status").textContent = bgLabel;
        document.getElementById("bpm-val").textContent = state.bpm;
        document.getElementById("font-val").textContent = FONTS[state.fontIndex].label;

        document.getElementById("dock-cam").classList.toggle("active", state.cam.enabled);
        document.getElementById("dock-front").classList.toggle("active", state.cam.facingMode === "user");
        document.getElementById("dock-back").classList.toggle("active", state.cam.facingMode === "environment");
        document.getElementById("dock-camfx").textContent = `FX: ${fxLabel}`;
        document.getElementById("dock-bgfx").textContent = `TAUSTA-FX: ${bgLabel}`;
        document.getElementById("dock-bgfx").classList.toggle("active", state.bgEnabled && state.bgScene !== 0);
        document.getElementById("dock-txt-toggle").classList.toggle("active", state.textVisible);

        document.getElementById("btn-cam-toggle").classList.toggle("active", state.cam.enabled);
        document.getElementById("btn-cam-front").classList.toggle("active", state.cam.facingMode === "user");
        document.getElementById("btn-cam-back").classList.toggle("active", state.cam.facingMode === "environment");
        document.getElementById("btn-bg-toggle").classList.toggle("active", state.bgEnabled && state.bgScene !== 0);
        document.getElementById("btn-txt-toggle").classList.toggle("active", state.textVisible);
        document.getElementById("btn-logo-toggle").classList.toggle("active", state.logoVisible);

        camFxListEl.querySelectorAll("button").forEach(b =>
          b.classList.toggle("active", Number(b.dataset.cfx) === state.cam.fxIndex)
        );
        bgFxListEl.querySelectorAll("button").forEach(b =>
          b.classList.toggle("active", state.bgEnabled && Number(b.dataset.bg) === state.bgScene)
        );
      }
      updateUi();

      const drawer = document.getElementById("control-drawer");
      function toggleDrawer() {
        const open = !drawer.classList.contains("open");
        drawer.classList.toggle("open", open);
        document.getElementById("dock-panel").classList.toggle("active", open);
      }

      document.getElementById("dock-cam").addEventListener("click", toggleCamera);
      document.getElementById("dock-front").addEventListener("click", switchToFrontCamera);
      document.getElementById("dock-back").addEventListener("click", switchToBackCamera);
      document.getElementById("dock-flip").addEventListener("click", flipCameraDevice);
      document.getElementById("dock-camfx").addEventListener("click", cycleCamFx);
      document.getElementById("dock-bgfx").addEventListener("click", () => {
        if (!state.bgEnabled) {
          state.bgEnabled = true;
          if (state.bgScene === 0) state.bgScene = 1;
        } else {
          state.bgScene = (state.bgScene + 1) % BG_SCENES.length;
          state.bgEnabled = state.bgScene !== 0;
        }
        updateUi();
      });
      document.getElementById("dock-txt-toggle").addEventListener("click", () => {
        state.textVisible = !state.textVisible;
        updateUi();
      });
      document.getElementById("dock-write").addEventListener("click", startDirectTyping);
      document.getElementById("dock-logo").addEventListener("click", () => document.getElementById("file-logo").click());
      document.getElementById("dock-panel").addEventListener("click", toggleDrawer);

      document.getElementById("btn-cam-toggle").addEventListener("click", toggleCamera);
      document.getElementById("btn-cam-front").addEventListener("click", switchToFrontCamera);
      document.getElementById("btn-cam-back").addEventListener("click", switchToBackCamera);
      document.getElementById("btn-cam-cycle").addEventListener("click", flipCameraDevice);
      document.getElementById("btn-bg-toggle").addEventListener("click", () => {
        state.bgEnabled = !state.bgEnabled;
        if (state.bgEnabled && state.bgScene === 0) state.bgScene = 1;
        updateUi();
      });
      document.getElementById("btn-tap").addEventListener("click", registerTap);
      document.getElementById("bpm-slider").addEventListener("input", e => {
        state.bpm = Number(e.target.value);
        updateUi();
      });
      document.getElementById("btn-logo-toggle").addEventListener("click", () => {
        state.logoVisible = !state.logoVisible;
        updateUi();
      });
      document.getElementById("btn-logo-dn").addEventListener("click", () => {
        state.logoScale = Math.max(0.25, +(state.logoScale - 0.15).toFixed(2));
      });
      document.getElementById("btn-logo-up").addEventListener("click", () => {
        state.logoScale = Math.min(3.2, +(state.logoScale + 0.15).toFixed(2));
      });
      document.getElementById("btn-txt-toggle").addEventListener("click", () => {
        state.textVisible = !state.textVisible;
        updateUi();
      });
      document.getElementById("btn-txt-write").addEventListener("click", startDirectTyping);
      document.getElementById("btn-font-cycle").addEventListener("click", () => {
        state.fontIndex = (state.fontIndex + 1) % FONTS.length;
        updateUi();
      });

      window.addEventListener("keydown", e => {
        if (state.typingActive && document.activeElement !== hiddenSink) {
          if (e.key === "Enter") { e.preventDefault(); commitDirectTyping(); return; }
          if (e.key === "Escape") { e.preventDefault(); cancelDirectTyping(); return; }
          if (e.key === "Backspace") { e.preventDefault(); state.typeDraft = state.typeDraft.slice(0, -1); return; }
          if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); state.typeDraft += e.key; return; }
          return;
        }
        if (document.activeElement === hiddenSink) return;

        const k = e.key.toLowerCase();
        if (k === "v") { e.preventDefault(); toggleCamera(); }
        else if (k === "f") { e.preventDefault(); switchToFrontCamera(); }
        else if (k === "b") { e.preventDefault(); switchToBackCamera(); }
        else if (k === "g") { e.preventDefault(); cycleCamFx(); }
        else if (k === "e") { e.preventDefault(); state.bgEnabled = !state.bgEnabled; updateUi(); }
        else if (k === "t") { e.preventDefault(); state.textVisible = !state.textVisible; updateUi(); }
        else if (k === "c") { e.preventDefault(); startDirectTyping(); }
        else if (k === "l") { e.preventDefault(); document.getElementById("file-logo").click(); }
        else if (e.code === "Space") { e.preventDefault(); registerTap(); }
        else if (k === "h") {
          e.preventDefault();
          state.hudHidden = !state.hudHidden;
          document.body.classList.toggle("hud-hidden", state.hudHidden);
        }
      });

      function frame(now) {
        const dt = Math.min(0.05, (now - state.lastFrame) / 1000);
        state.lastFrame = now;
        state.time += dt;

        state.beatPhase += dt * (state.bpm / 60);
        if (state.beatPhase >= 1) {
          state.beatPhase -= 1;
          state.bassPulse = 1.0;
        }
        state.bassPulse = Math.max(0, state.bassPulse - dt * 3.5);

        renderBackgroundScene();
        renderLiveCameraEffects(state.time, now);
        renderLogo();
        renderText();

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
