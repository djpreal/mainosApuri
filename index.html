<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG Mainosstudio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f131a;
      color: #f3f6fc;
    }
    .container {
      max-width: 1020px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 880px) {
      .container {
        grid-template-columns: 410px 1fr;
        align-items: start;
      }
    }
    .card {
      background: #181e29;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card:last-child {
      margin-bottom: 0;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.2rem;
    }
    .sub {
      margin: 0;
      color: #9fb0c7;
      font-size: 0.84rem;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #dce6f5;
    }
    label:first-child {
      margin-top: 0;
    }
    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3c485e;
      background: #10151e;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea {
      min-height: 64px;
      resize: vertical;
    }
    input[type="color"],
    input[type="range"] {
      width: 100%;
      margin: 6px 0;
    }
    input[type="color"] {
      height: 40px;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid #3c485e;
      background: #10151e;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    .btn {
      width: 100%;
      min-height: 42px;
      padding: 9px 7px;
      border-radius: 8px;
      border: 1px solid #3f4b63;
      background: #232c3d;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.active {
      background: #e11d48;
      border-color: #fb7185;
    }
    .btn.save-main {
      background: #15803d;
      border-color: #4ade80;
    }
    .preview-box {
      background: #181e29;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }
    .canvas-wrap {
      max-width: 430px;
      margin: 0 auto;
      background: #090c10;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2d3748;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }
    #statusText {
      margin-top: 8px;
      font-size: 0.84rem;
      color: #86efac;
      min-height: 20px;
    }
    #previewSaveBox {
      display: none;
      max-width: 430px;
      margin: 12px auto 0;
      background: #10151e;
      border: 1px solid #3c485e;
      border-radius: 10px;
      padding: 10px;
    }
    #previewSaveBox img {
      width: 100%;
      border-radius: 8px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <div class="card">
        <h1>IG Mainosstudio</h1>
        <p class="sub" id="topSizeLabel">Koko: 4:5 Syöte (1080 × 1350 px)</p>
      </div>

      <div class="card">
        <label for="photoInput">1. Kuva</label>
        <input type="file" id="photoInput" accept="image/*" />

        <label>2. IG-kuvakoko</label>
        <div class="grid-3">
          <button type="button" class="btn size-btn active" data-w="1080" data-h="1350" data-code="4x5" data-label="4:5 Syöte">4:5 Syöte</button>
          <button type="button" class="btn size-btn" data-w="1080" data-h="1080" data-code="1x1" data-label="1:1 Neliö">1:1 Neliö</button>
          <button type="button" class="btn size-btn" data-w="1080" data-h="1920" data-code="9x16" data-label="9:16 Story">9:16 Story</button>
        </div>

        <label>3. Ammattimaiset oletussetit (12 kpl)</label>
        <div class="grid-3">
          <button type="button" class="btn theme-btn active" data-theme="kampanja">Kampanja</button>
          <button type="button" class="btn theme-btn" data-theme="uutuus">Uutuus</button>
          <button type="button" class="btn theme-btn" data-theme="tyyli">Boutique</button>

          <button type="button" class="btn theme-btn" data-theme="joulu1">Joulu Ale</button>
          <button type="button" class="btn theme-btn" data-theme="joulu2">Joulu Kuusi</button>
          <button type="button" class="btn theme-btn" data-theme="joulu3">Joulu Kulta</button>

          <button type="button" class="btn theme-btn" data-theme="kesa1">Kesäale</button>
          <button type="button" class="btn theme-btn" data-theme="kesa2">Kesä Meri</button>
          <button type="button" class="btn theme-btn" data-theme="kesa3">Kesäilta</button>

          <button type="button" class="btn theme-btn" data-theme="talvi1">Talvi Ale</button>
          <button type="button" class="btn theme-btn" data-theme="talvi2">Jäinen</button>
          <button type="button" class="btn theme-btn" data-theme="talvi3">Pakkanen</button>
        </div>
      </div>

      <div class="card">
        <label for="badgeInput">Yläteksti / Tunniste</label>
        <input type="text" id="badgeInput" value="VIIKONLOPPUTARJOUS" />

        <label for="titleInput">Pääotsikko</label>
        <textarea id="titleInput">Nyt -30% kaikesta</textarea>

        <label for="subInput">Alaotsikko</label>
        <input type="text" id="subInput" value="Voimassa sunnuntaihin asti verkkokaupassa." />

        <label for="ctaInput">Nappiteksti</label>
        <input type="text" id="ctaInput" value="Osta nyt" />

        <label for="fontSelect">Fonttityyli</label>
        <select id="fontSelect">
          <option value="sans" selected>Moderni Sans (selkeä ja napakka)</option>
          <option value="display">Näyttävä Display (iso ja iskevä)</option>
          <option value="serif">Klassinen Serif (tyylikäs ja editorial)</option>
          <option value="geo">Geometrinen (moderni brändi)</option>
        </select>

        <label for="textScaleInput">Tekstikoko: <span id="textScaleVal">115%</span></label>
        <input type="range" id="textScaleInput" min="65" max="165" value="115" />

        <div class="grid-2">
          <div>
            <label for="posSelect">Sijainti</label>
            <select id="posSelect">
              <option value="bottom" selected>Alhaalla</option>
              <option value="top">Ylhäällä</option>
              <option value="center">Keskellä</option>
            </select>
          </div>
          <div>
            <label for="alignSelect">Tasaus</label>
            <select id="alignSelect">
              <option value="left" selected>Vasemmalle</option>
              <option value="center">Keskitetty</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="accentInput">Väri</label>
            <input type="color" id="accentInput" value="#e11d48" />
          </div>
          <div>
            <label for="darkInput">Tummennus</label>
            <input type="range" id="darkInput" min="0" max="85" value="48" />
          </div>
        </div>

        <label for="zoomInput">Kuvan zoomaus</label>
        <input type="range" id="zoomInput" min="100" max="250" value="100" />
        <button type="button" class="btn" id="centerPhotoBtn">Keskitä kuva</button>
      </div>

      <div class="card">
        <p class="sub" id="exportSizeText">Tallennettava koko: 4:5 Syöte (1080 × 1350 px)</p>
        <div style="margin-top:8px;">
          <button type="button" class="btn save-main" id="makePreviewBtn">Tee tallennuskuva (pitkä painallus)</button>
        </div>
        <div class="grid-2" style="margin-top:6px;">
          <button type="button" class="btn" id="dlPngBtn">Lataa PNG</button>
          <button type="button" class="btn" id="dlJpgBtn">Lataa JPG</button>
        </div>
        <div id="statusText"></div>
      </div>
    </div>

    <div class="preview-box">
      <div class="canvas-wrap">
        <canvas id="adCanvas" width="1080" height="1350"></canvas>
      </div>
      <p class="sub" style="margin-top:8px;">Vedä kuvaa sormella tai hiirellä siirtääksesi sitä.</p>

      <div id="previewSaveBox">
        <p class="sub" id="previewSaveCaption">Paina kuvaa alla pitkään ja valitse <strong>Tallenna kuva</strong>.</p>
        <img id="previewSaveImg" alt="Valmis mainos" />
      </div>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      const canvas = document.getElementById("adCanvas");
      const ctx = canvas.getContext("2d");

      const FONTS = {
        sans: {
          stack: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
          titleWeight: "900",
          subWeight: "600"
        },
        display: {
          stack: "Impact, 'Arial Black', 'Segoe UI', sans-serif",
          titleWeight: "900",
          subWeight: "700"
        },
        serif: {
          stack: "Georgia, 'Times New Roman', Times, serif",
          titleWeight: "700",
          subWeight: "400"
        },
        geo: {
          stack: "'Trebuchet MS', 'Segoe UI', Roboto, sans-serif",
          titleWeight: "800",
          subWeight: "600"
        }
      };

      const THEMES = {
        kampanja: {
          accent: "#e11d48", bg1: "#2a1220", bg2: "#0d1017", dark: 48,
          font: "display", scale: 125,
          badge: "MEGA-ALE", title: "Nyt -30% kaikesta", sub: "Kampanja voimassa sunnuntaihin.", cta: "Osta nyt",
          pos: "bottom", align: "left"
        },
        uutuus: {
          accent: "#eab308", bg1: "#2b220d", bg2: "#0d1017", dark: 42,
          font: "geo", scale: 115,
          badge: "UUTUUS", title: "Uusi mallisto nyt täällä", sub: "Tuoreet uutuudet ensimmäisenä.", cta: "Katso uutuudet",
          pos: "top", align: "left"
        },
        tyyli: {
          accent: "#e2e8f0", bg1: "#1d222e", bg2: "#0a0c12", dark: 52,
          font: "serif", scale: 112,
          badge: "BOUTIQUE", title: "Ajatonta tyyliä", sub: "Kuratoitu valikoima rajatun ajan.", cta: "Tutustu",
          pos: "center", align: "center"
        },

        joulu1: {
          accent: "#dc2626", bg1: "#330c12", bg2: "#10080a", dark: 50,
          font: "display", scale: 122,
          badge: "JOULUKAMPANJA", title: "Joulun parhaat lahjat", sub: "Jopa -25% valituista lahjoista.", cta: "Katso lahjat",
          pos: "bottom", align: "left"
        },
        joulu2: {
          accent: "#16a34a", bg1: "#0d2b1a", bg2: "#08120c", dark: 46,
          font: "serif", scale: 116,
          badge: "HYVÄÄ JOULUA", title: "Lämmin jouluhetki", sub: "Perinteiset lahjat ja herkut.", cta: "Jouluvalikoima",
          pos: "bottom", align: "center"
        },
        joulu3: {
          accent: "#eab308", bg1: "#2e1e09", bg2: "#110c06", dark: 52,
          font: "serif", scale: 120,
          badge: "JOULUN LOISTOA", title: "Kultaiset hetket", sub: "Rajoitettu jouluerä nyt myynnissä.", cta: "Varaa nyt",
          pos: "center", align: "center"
        },

        kesa1: {
          accent: "#f97316", bg1: "#2e150a", bg2: "#0c121c", dark: 42,
          font: "display", scale: 126,
          badge: "KESÄALE", title: "Kesän kuumimmat edut", sub: "Jopa -40% kesän suosikeista.", cta: "Nappaa etu",
          pos: "bottom", align: "left"
        },
        kesa2: {
          accent: "#06b6d4", bg1: "#092536", bg2: "#08111c", dark: 38,
          font: "geo", scale: 114,
          badge: "KESÄ & LOMA", title: "Valmiina kesään", sub: "Raikkaat uutuudet aurinkopäiviin.", cta: "Tutustu",
          pos: "top", align: "left"
        },
        kesa3: {
          accent: "#f59e0b", bg1: "#2e1712", bg2: "#110c14", dark: 45,
          font: "serif", scale: 115,
          badge: "KESÄILTA", title: "Kesäiltojen parhaat hetket", sub: "Nauti pitkistä illoista tyylillä.", cta: "Lue lisää",
          pos: "bottom", align: "center"
        },

        talvi1: {
          accent: "#38bdf8", bg1: "#0b2236", bg2: "#090d16", dark: 48,
          font: "display", scale: 122,
          badge: "TALVIKAMPANJA", title: "Varustaudu talveen", sub: "Lämpimät talvituotteet heti varastosta.", cta: "Katso lisää",
          pos: "bottom", align: "left"
        },
        talvi2: {
          accent: "#6366f1", bg1: "#161838", bg2: "#090b14", dark: 48,
          font: "geo", scale: 116,
          badge: "TALVIETU", title: "Raikkaat talvitarjoukset", sub: "Säästä valituista tuotteista nyt.", cta: "Hyödynnä",
          pos: "top", align: "center"
        },
        talvi3: {
          accent: "#cbd5e1", bg1: "#1b212c", bg2: "#0c0f14", dark: 50,
          font: "serif", scale: 110,
          badge: "PAKKANEN & HYGGE", title: "Lämpöä talvipäiviin", sub: "Pehmeät suosikit arkeen ja kotiin.", cta: "Tutustu",
          pos: "center", align: "center"
        }
      };

      let W = 1080;
      let H = 1350;
      let ratioCode = "4x5";
      let sizeLabel = "4:5 Syöte";
      let currentTheme = "kampanja";
      let bg1 = THEMES.kampanja.bg1;
      let bg2 = THEMES.kampanja.bg2;
      let photo = null;
      let panX = 0;
      let panY = 0;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function setStatus(msg) {
        document.getElementById("statusText").textContent = msg;
      }

      function updateScaleLabel() {
        const val = document.getElementById("textScaleInput").value;
        document.getElementById("textScaleVal").textContent = val + "%";
      }

      function wrapText(text, maxW, font) {
        if (!text || !text.trim()) return [];
        ctx.font = font;
        const paragraphs = text.split("\n");
        const lines = [];
        for (const para of paragraphs) {
          const words = para.trim().split(/\s+/).filter(Boolean);
          if (!words.length) continue;
          let line = words[0];
          for (let i = 1; i < words.length; i++) {
            const test = line + " " + words[i];
            if (ctx.measureText(test).width <= maxW) {
              line = test;
            } else {
              lines.push(line);
              line = words[i];
            }
          }
          lines.push(line);
        }
        return lines;
      }

      function draw() {
        updateScaleLabel();

        const accent = document.getElementById("accentInput").value;
        const dark = Number(document.getElementById("darkInput").value) / 100;
        const zoom = Number(document.getElementById("zoomInput").value) / 100;
        const pos = document.getElementById("posSelect").value;
        const align = document.getElementById("alignSelect").value;
        const fontKey = document.getElementById("fontSelect").value;
        const scale = Number(document.getElementById("textScaleInput").value) / 100;

        const fontObj = FONTS[fontKey] || FONTS.sans;
        const badge = document.getElementById("badgeInput").value;
        const title = document.getElementById("titleInput").value;
        const sub = document.getElementById("subInput").value;
        const cta = document.getElementById("ctaInput").value;

        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, bg1);
        grad.addColorStop(1, bg2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        if (photo) {
          const ir = photo.width / photo.height;
          const cr = W / H;
          let bw = W;
          let bh = H;
          if (ir > cr) {
            bw = H * ir;
          } else {
            bh = W / ir;
          }
          const dw = bw * zoom;
          const dh = bh * zoom;
          ctx.drawImage(photo, (W - dw) / 2 + panX, (H - dh) / 2 + panY, dw, dh);
        }

        if (dark > 0) {
          ctx.fillStyle = "rgba(0,0,0," + dark + ")";
          ctx.fillRect(0, 0, W, H);
        }

        const pad = 76;
        const maxW = W - pad * 2;

        const badgePx = Math.round(34 * scale);
        const titlePx = Math.round(92 * scale);
        const subPx = Math.round(42 * scale);
        const ctaPx = Math.round(38 * scale);

        const badgeFont = "800 " + badgePx + "px " + fontObj.stack;
        const titleFont = fontObj.titleWeight + " " + titlePx + "px " + fontObj.stack;
        const subFont = fontObj.subWeight + " " + subPx + "px " + fontObj.stack;
        const ctaFont = "800 " + ctaPx + "px " + fontObj.stack;

        const tLines = wrapText(title, maxW, titleFont);
        const sLines = wrapText(sub, maxW, subFont);

        const hasBadge = Boolean(badge.trim());
        const hasCta = Boolean(cta.trim());

        const badgeH = hasBadge ? Math.round(badgePx * 1.75) : 0;
        const badgeGap = hasBadge ? Math.round(24 * scale) : 0;
        const titleStep = Math.round(titlePx * 1.12);
        const titleBlockH = tLines.length * titleStep;
        const subGap = sLines.length ? Math.round(22 * scale) : 0;
        const subStep = Math.round(subPx * 1.25);
        const subBlockH = sLines.length * subStep;
        const ctaGap = hasCta ? Math.round(32 * scale) : 0;
        const ctaH = hasCta ? Math.round(ctaPx * 2.05) : 0;

        const totalH = badgeH + badgeGap + titleBlockH + subGap + subBlockH + ctaGap + ctaH;

        let y = H - 140 - totalH;
        if (pos === "top") y = H > 1500 ? 190 : 110;
        if (pos === "center") y = (H - totalH) / 2;
        y = Math.max(80, Math.min(H - totalH - 80, y));

        const tx = align === "center" ? W / 2 : pad;

        if (hasBadge) {
          ctx.save();
          ctx.font = badgeFont;
          const bTxt = badge.trim().toUpperCase();
          const bw = ctx.measureText(bTxt).width + Math.round(46 * scale);
          const bx = align === "center" ? (W - bw) / 2 : pad;
          ctx.fillStyle = accent;
          ctx.fillRect(bx, y, bw, badgeH);
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(bTxt, bx + bw / 2, y + badgeH / 2 + 1);
          ctx.restore();
          y += badgeH + badgeGap;
        }

        if (tLines.length) {
          ctx.save();
          ctx.font = titleFont;
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = align;
          ctx.textBaseline = "top";
          ctx.shadowColor = "rgba(0,0,0,0.6)";
          ctx.shadowBlur = 18;
          ctx.shadowOffsetY = 4;
          tLines.forEach(function (l, idx) {
            ctx.fillText(l, tx, y + idx * titleStep);
          });
          ctx.restore();
          y += titleBlockH;
        }

        if (sLines.length) {
          y += subGap;
          ctx.save();
          ctx.font = subFont;
          ctx.fillStyle = "#f8fafc";
          ctx.textAlign = align;
          ctx.textBaseline = "top";
          ctx.shadowColor = "rgba(0,0,0,0.55)";
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 2;
          sLines.forEach(function (l, idx) {
            ctx.fillText(l, tx, y + idx * subStep);
          });
          ctx.restore();
          y += subBlockH;
        }

        if (hasCta) {
          y += ctaGap;
          ctx.save();
          ctx.font = ctaFont;
          const cTxt = cta.trim();
          const cw = Math.max(Math.round(240 * scale), ctx.measureText(cTxt).width + Math.round(78 * scale));
          const cx = align === "center" ? (W - cw) / 2 : pad;
          ctx.fillStyle = accent;
          ctx.fillRect(cx, y, cw, ctaH);
          ctx.fillStyle = "#ffffff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(cTxt, cx + cw / 2, y + ctaH / 2 + 1);
          ctx.restore();
        }
      }

      document.querySelectorAll(".size-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          W = Number(btn.dataset.w);
          H = Number(btn.dataset.h);
          ratioCode = btn.dataset.code;
          sizeLabel = btn.dataset.label;
          canvas.width = W;
          canvas.height = H;

          document.querySelectorAll(".size-btn").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          document.getElementById("topSizeLabel").textContent = "Koko: " + sizeLabel + " (" + W + " × " + H + " px)";
          document.getElementById("exportSizeText").textContent = "Tallennettava koko: " + sizeLabel + " (" + W + " × " + H + " px)";
          draw();
        });
      });

      document.querySelectorAll(".theme-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const key = btn.dataset.theme;
          const t = THEMES[key];
          if (!t) return;
          currentTheme = key;
          bg1 = t.bg1;
          bg2 = t.bg2;
          document.getElementById("accentInput").value = t.accent;
          document.getElementById("darkInput").value = t.dark;
          document.getElementById("fontSelect").value = t.font;
          document.getElementById("textScaleInput").value = t.scale;
          document.getElementById("badgeInput").value = t.badge;
          document.getElementById("titleInput").value = t.title;
          document.getElementById("subInput").value = t.sub;
          document.getElementById("ctaInput").value = t.cta;
          document.getElementById("posSelect").value = t.pos;
          document.getElementById("alignSelect").value = t.align;

          document.querySelectorAll(".theme-btn").forEach(function (b) {
            b.classList.toggle("active", b.dataset.theme === currentTheme);
          });
          draw();
        });
      });

      [
        "badgeInput", "titleInput", "subInput", "ctaInput",
        "fontSelect", "textScaleInput", "posSelect", "alignSelect",
        "accentInput", "darkInput", "zoomInput"
      ].forEach(function (id) {
        const el = document.getElementById(id);
        el.addEventListener("input", draw);
        el.addEventListener("change", draw);
      });

      document.getElementById("centerPhotoBtn").addEventListener("click", function () {
        panX = 0;
        panY = 0;
        document.getElementById("zoomInput").value = 100;
        draw();
      });

      document.getElementById("photoInput").addEventListener("change", function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          const img = new Image();
          img.onload = function () {
            photo = img;
            panX = 0;
            panY = 0;
            document.getElementById("zoomInput").value = 100;
            draw();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      function getCanvasPoint(e) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches && e.touches[0];
        const cx = touch ? touch.clientX : e.clientX;
        const cy = touch ? touch.clientY : e.clientY;
        return {
          x: ((cx - rect.left) / rect.width) * W,
          y: ((cy - rect.top) / rect.height) * H
        };
      }

      function startMove(e) {
        if (!photo) return;
        dragging = true;
        const pt = getCanvasPoint(e);
        lastX = pt.x;
        lastY = pt.y;
      }

      function doMove(e) {
        if (!dragging || !photo) return;
        if (e.cancelable) e.preventDefault();
        const pt = getCanvasPoint(e);
        panX += pt.x - lastX;
        panY += pt.y - lastY;
        lastX = pt.x;
        lastY = pt.y;
        draw();
      }

      function stopMove() {
        dragging = false;
      }

      canvas.addEventListener("mousedown", startMove);
      window.addEventListener("mousemove", doMove);
      window.addEventListener("mouseup", stopMove);

      canvas.addEventListener("touchstart", startMove, { passive: true });
      canvas.addEventListener("touchmove", doMove, { passive: false });
      window.addEventListener("touchend", stopMove);

      document.getElementById("makePreviewBtn").addEventListener("click", function () {
        const url = canvas.toDataURL("image/png");
        const box = document.getElementById("previewSaveBox");
        const img = document.getElementById("previewSaveImg");
        const cap = document.getElementById("previewSaveCaption");
        img.src = url;
        cap.innerHTML = "<strong>" + sizeLabel + " (" + W + " × " + H + " px):</strong> Paina kuvaa alla pitkään ja valitse <em>Tallenna kuva</em>.";
        box.style.display = "block";
        setStatus("Tallennuskuva luotu koossa " + sizeLabel + " (" + W + "×" + H + " px).");
        box.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });

      function saveFile(ext) {
        const mime = ext === "jpg" ? "image/jpeg" : "image/png";
        const url = canvas.toDataURL(mime, 0.92);
        const filename = "ig-" + ratioCode + "-" + W + "x" + H + "." + ext;
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setStatus("Ladattu: " + filename + " (" + sizeLabel + ")");
      }

      document.getElementById("dlPngBtn").addEventListener("click", function () {
        saveFile("png");
      });

      document.getElementById("dlJpgBtn").addEventListener("click", function () {
        saveFile("jpg");
      });

      draw();
    });
  </script>
</body>
</html>
